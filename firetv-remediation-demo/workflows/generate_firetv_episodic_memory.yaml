version: "1"
name: generate_firetv_episodic_memory
description: >
  Generates episodic memory from a Fire TV support conversation via Agent Builder.
  Fetches conversation, summarizes via AI agent, indexes into Elasticsearch.
  semantic_text field auto-embeds summary via .jina-embeddings-v5-omni-small at index time.
  Accepts an optional session_date_override so demo narratives can seed realistic
  historical dates instead of all memories sharing the same ingest timestamp.
enabled: true
tags: ["memory", "episodic", "firetv-remediation-demo"]

inputs:
  - name: conversation_id
    type: string
    required: true
    description: "Agent Builder conversation ID to convert to episodic memory"
  - name: user_id
    type: string
    required: true
    description: "User identifier (e.g. jordan_price)"
  - name: user_name
    type: string
    required: false
    default: "Unknown User"
    description: "Display name for the user"
  - name: issue_context
    type: string
    required: false
    default: ""
    description: "Issue ladder slug this conversation belongs to (e.g. power_failure)"
  - name: session_date_override
    type: string
    required: false
    default: ""
    description: "Explicit ISO date to stamp this memory with, for realistic demo timelines. Falls back to the conversation's real created_at when omitted."

triggers:
  - type: manual

steps:
  # Step 1: Fetch the full conversation from Agent Builder
  - name: fetch_conversation
    type: kibana.request
    with:
      method: GET
      path: /api/agent_builder/conversations/{{ inputs.conversation_id }}

  # Step 2: AI agent summarizes the conversation
  - name: summarize_memory
    type: ai.agent
    agent-id: "elastic-ai-agent"
    with:
      message: |
        Analyze this Amazon Fire TV customer support conversation and write a 2-3 sentence summary.
        Focus on: what problem the customer reported, what troubleshooting steps were tried, and the outcome.
        Write ONLY the summary text — no labels, no JSON, no formatting.

        Conversation title: {{ steps.fetch_conversation.output.title }}
        {% for round in steps.fetch_conversation.output.rounds %}
        User: {{ round.input.message }}
        Agent: {{ round.response.message }}
        {% endfor %}

  # Step 3: Extract topics
  - name: extract_topics
    type: ai.agent
    agent-id: "elastic-ai-agent"
    with:
      message: |
        From this conversation summary, extract a comma-separated list of topics (max 5).
        Return ONLY the comma-separated list, nothing else.
        Example: "power failure, factory reset, remote pairing"

        Summary: {{ steps.summarize_memory.output.message }}

  # Step 4: Index episodic memory — session_date uses override if provided, else real fetch time
  - name: index_episodic_memory
    type: elasticsearch.request
    with:
      method: PUT
      path: /firetv_episodic_memory/_doc/{{ inputs.conversation_id }}
      body:
        conversation_id: "{{ inputs.conversation_id }}"
        user_id: "{{ inputs.user_id }}"
        user_name: "{{ inputs.user_name }}"
        session_date: "{% if inputs.session_date_override %}{{ inputs.session_date_override }}{% else %}{{ steps.fetch_conversation.output.created_at }}{% endif %}"
        topic: "{{ steps.fetch_conversation.output.title }}"
        summary: "{{ steps.summarize_memory.output.message }}"
        topics: "{{ steps.extract_topics.output.message }}"
        key_entities: "{{ steps.extract_topics.output.message }}"
        issue_context: "{{ inputs.issue_context }}"
        emotional_valence: "neutral"
        importance_score: 7.0
        action_items: ""
        raw_conversation_text: "{{ steps.fetch_conversation.output.title }}"
        memory_source: "kibana_workflow"
        workflow_execution_id: "{{ execution.id }}"
